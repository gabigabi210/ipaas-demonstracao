services:
  # ---- Sistemas independentes (APIs HTTP) ----
  estoque:
    build: .
    command: python -m services.estoque
    ports: ["8001:8001"]

  faturamento:
    build: .
    command: python -m services.faturamento
    ports: ["8002:8002"]

  notificacao:
    build: .
    command: python -m services.notificacao
    environment:
      FALHAR_PRIMEIRA: "1"   # 1ª chamada falha (503) para demonstrar o retry
    ports: ["8003:8003"]

  # ---- Plataforma iPaaS / low-code: n8n (principal) ----
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: America/Recife
      TZ: America/Recife
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro      # fluxo pronto para importar
    depends_on: [estoque, faturamento, notificacao]

  # ---- Motor próprio em Python (opcional): docker compose --profile proprio up ----
  ipaas:
    build: .
    profiles: ["proprio"]
    command: python -m ipaas.server
    environment:
      ESTOQUE_URL: http://estoque:8001
      FATURAMENTO_URL: http://faturamento:8002
      NOTIFICACAO_URL: http://notificacao:8003
    depends_on: [estoque, faturamento, notificacao]
    ports: ["8000:8000"]

volumes:
  n8n_data:
